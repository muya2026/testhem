<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">testhem — seven social games in orbit</title>
  <desc id="desc">A night-sky banner with seven glowing elliptical game portals orbiting a warm central star.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081323"/><stop offset=".55" stop-color="#070b17"/><stop offset="1" stop-color="#02050d"/></linearGradient>
    <radialGradient id="neb"><stop stop-color="#245765" stop-opacity=".42"/><stop offset="1" stop-color="#12112e" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun"><stop stop-color="#fff7cf"/><stop offset=".25" stop-color="#ffc783"/><stop offset=".72" stop-color="#ff976b" stop-opacity=".85"/><stop offset="1" stop-color="#ff976b" stop-opacity="0"/></radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#c6ffe2"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <ellipse cx="885" cy="280" rx="440" ry="275" fill="url(#neb)" filter="url(#blur)"/>
  <g fill="#e2eeff" opacity=".64">
    <circle cx="93" cy="77" r="1.2"/><circle cx="264" cy="145" r="1.4"/><circle cx="411" cy="78" r="1"/><circle cx="508" cy="210" r="1.4"/><circle cx="697" cy="74" r="1.1"/><circle cx="841" cy="119" r="1"/><circle cx="1118" cy="76" r="1.5"/><circle cx="1200" cy="187" r="1"/><circle cx="1041" cy="380" r="1.4"/><circle cx="804" cy="449" r="1.1"/><circle cx="649" cy="385" r="1"/><circle cx="1186" cy="440" r="1.5"/>
  </g>
  <g transform="translate(870 270)" fill="none" stroke="#c9e8ff" stroke-opacity=".23">
    <ellipse rx="343" ry="131" transform="rotate(-12)"/><ellipse rx="286" ry="107" transform="rotate(11)"/><ellipse rx="226" ry="83" transform="rotate(-27)"/><ellipse rx="164" ry="60" transform="rotate(23)"/>
  </g>
  <g filter="url(#glow)" fill="none" stroke-width="2">
    <g transform="translate(536 306) rotate(-17)"><ellipse rx="30" ry="41" stroke="#8deaff"/><ellipse rx="24" ry="34" stroke="#8deaff" stroke-opacity=".46"/><circle r="3" fill="#8deaff" stroke="none"/></g>
    <g transform="translate(603 202) rotate(10)"><ellipse rx="27" ry="36" stroke="#d2ff73"/><ellipse rx="22" ry="30" stroke="#d2ff73" stroke-opacity=".42"/><circle r="3" fill="#d2ff73" stroke="none"/></g>
    <g transform="translate(677 365) rotate(-8)"><ellipse rx="25" ry="34" stroke="#ffc886"/><ellipse rx="20" ry="28" stroke="#ffc886" stroke-opacity=".4"/><circle r="3" fill="#ffc886" stroke="none"/></g>
    <g transform="translate(765 169) rotate(18)"><ellipse rx="25" ry="35" stroke="#d4a8ff"/><ellipse rx="20" ry="29" stroke="#d4a8ff" stroke-opacity=".44"/><circle r="3" fill="#d4a8ff" stroke="none"/></g>
    <g transform="translate(862 373) rotate(-15)"><ellipse rx="26" ry="36" stroke="#8de0b9"/><ellipse rx="21" ry="29" stroke="#8de0b9" stroke-opacity=".43"/><circle r="3" fill="#8de0b9" stroke="none"/></g>
    <g transform="translate(976 216) rotate(13)"><ellipse rx="28" ry="38" stroke="#f99bcf"/><ellipse rx="22" ry="31" stroke="#f99bcf" stroke-opacity=".42"/><circle r="3" fill="#f99bcf" stroke="none"/></g>
    <g transform="translate(1090 320) rotate(-7)"><ellipse rx="26" ry="35" stroke="#7db5ff"/><ellipse rx="20" ry="29" stroke="#7db5ff" stroke-opacity=".43"/><circle r="3" fill="#7db5ff" stroke="none"/></g>
  </g>
  <g transform="translate(870 270)" filter="url(#glow)"><circle r="58" fill="url(#sun)"/><circle r="13" fill="#ffe8b3"/><circle r="5" fill="#fff9e6"/></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="72" y="126" fill="#a8f3d0" font-size="14" font-weight="700" letter-spacing="4">THE SOCIAL GAME OBSERVATORY</text>
    <text x="66" y="236" fill="url(#word)" font-size="96" font-weight="700" letter-spacing="-7">testhem</text>
    <text x="74" y="281" fill="#d0dae8" font-size="21">Seven games in orbit. One crew at the center.</text>
    <text x="74" y="322" fill="#91a5ba" font-size="13" letter-spacing="2">BLUFF · CHOOSE · GUESS · TELL A STORY · LEAVE YOUR MARK</text>
    <rect x="73" y="370" width="286" height="45" rx="22" fill="#d6ff78"/>
    <text x="216" y="399" fill="#0a1107" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">PASS-AND-PLAY · 2–8</text>
  </g>
</svg>
